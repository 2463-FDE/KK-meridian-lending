name: meridian-lending

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  origination-service:
    build: ./services/origination-service
    env_file:
      - path: .env
        required: false
    # Security fix: no host port mapping -- origination-service is reachable only
    # on the internal compose network now. It used to publish 8001:8001, so anyone
    # on the host could call GET /applications/{id}/financials directly with a
    # forged X-User-Role: admin header and read borrower income/employment data.
    # The gateway strips inbound X-User-* headers before setting its own trusted
    # ones, but only for requests that actually go through it -- a direct hit on
    # the published port bypassed that entirely.
    environment:
      # Shared with decision-service/gateway below -- sent as X-Internal-Token
      # on the server-to-server call to decision-service so it has a check to
      # fail closed on even if a future compose change re-publishes its port.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
      # Read by this service's startup token validation, which treats an unset
      # ENVIRONMENT as production and fails closed (PR #18). Declared here
      # because compose passes a host variable through only to services that
      # name it, and `env_file: .env` is required:false -- see
      # db/tests/test_compose_declares_every_env_var_services_read.py.
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env -- see .env.example, or run python scripts/bootstrap_env.py}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./policies:/app/policies:ro
      - ./kb_dump:/app/kb_dump:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicing-service:
    build: ./services/servicing-service
    env_file:
      - path: .env
        required: false
    # No published host port: this service moves money (adjust-balance, charge
    # application) -- publishing this port let anyone on the host bypass the
    # gateway entirely and hit it directly (review finding). Reachable from other
    # containers on the compose network by service name; not from the host.
    environment:
      # Required, and deliberately NOT defaulted. validate_internal_token skips
      # every strength and known-token check when ENVIRONMENT is development/
      # dev/test/local, so a base file that defaulted to development would hand
      # any production-like deploy money routes guarded by whatever string was
      # typed -- including a short or repository-known one. That is the exact
      # case this service's token exists to prevent, so the default is gone and
      # local work opts in explicitly via `make bootstrap`.
      ENVIRONMENT: ${ENVIRONMENT:?required -- run `make bootstrap` for local development; never defaults to development, because that would skip token validation}
      # Required on every money-moving route now (see app/main.py::_require_internal).
      # The network boundary above was previously the ONLY control, because none
      # of those routes checked anything -- the same position kyc-service was in
      # when it turned out to be reachable anyway. Same default as the other
      # services so they agree without an .env entry.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
      # The PUBLIC half. Servicing verifies human principals and cannot mint one.
      PRINCIPAL_VERIFY_KEY: ${PRINCIPAL_VERIFY_KEY:?set PRINCIPAL_VERIFY_KEY in .env -- generate with python db/tools/generate_principal_keypair.py}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./db/settlement.csv:/app/data/settlement.csv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The scheduled reconciliation control (D7).
  #
  # Previously the repository provided a command and a runbook telling operators
  # to wire up cron themselves. A normal `docker compose up` therefore kept
  # answering /health while reconciliation never ran once -- which is precisely
  # the failure D7 names: a control that silently is not running looks exactly
  # like one that is running and finding nothing.
  #
  # In the DEFAULT services list, not behind a profile. A control an operator
  # has to remember to switch on is the same defect with an extra step.
  #
  # Same image and environment as servicing-service, so it reads the same
  # settlement file, the same database and the same token rules; it just runs a
  # different entry point.
  reconciliation:
    build: ./services/servicing-service
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?required -- run `make bootstrap` for local development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
      # Seconds between runs. Daily by default; overridable so a demo or a test
      # environment can run it often enough to observe.
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./db/settlement.csv:/app/data/settlement.csv:ro
    # `restart: unless-stopped` is the point. The job exits non-zero on a breach
    # or a control failure, and the scheduler must survive that -- an exit code
    # is a finding to be read, not a reason to stop reconciling. The loop below
    # runs the job, logs the exit code, and sleeps regardless of outcome.
    restart: unless-stopped
    command: >
      python -m app.reconcile_scheduler

  kyc-service:
    build: ./services/kyc-service
    env_file:
      - path: .env
        required: false
    # No host port. This service used to publish 8003:8003 while checking no
    # X-Internal-Token, which made it the one remaining way to reach a backend
    # service around the gateway: POST localhost:8003/kyc/check wrote a
    # kyc_checks row for any applicant_id, unauthenticated. Its four siblings
    # were closed the same way in PR #6; this one was missed. Reach it through
    # the gateway (/kyc/*) or from another service on this network.
    #
    # Restored during the merge with PR #22: taking that branch's compose wholesale
    # would have re-published the port, so the fix and the merge are both recorded
    # here. A conflict resolution that quietly reopens a closed hole is the worst
    # kind, because the PR that closed it still shows green.
    environment:
      # Required on POST /kyc/check, which writes the CIP compliance record and
      # was reachable with no credential at all before PR #18.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
      # Read by this service's startup token validation, which treats an unset
      # ENVIRONMENT as production and fails closed (PR #18). Declared here
      # because compose passes a host variable through only to services that
      # name it, and `env_file: .env` is required:false -- see
      # db/tests/test_compose_declares_every_env_var_services_read.py.
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env -- see .env.example, or run python scripts/bootstrap_env.py}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  decision-service:
    build: ./services/decision-service
    env_file:
      - path: .env
        required: false
    environment:
      # .env is optional (above) for a clean-checkout `docker compose up`; without it
      # ENVIRONMENT is otherwise unset and decisioning fails closed on every request
      # (see app/config.py). Default the local compose path to dev so it boots ready
      # to use; an .env that sets ENVIRONMENT still wins.
      ENVIRONMENT: ${ENVIRONMENT:?required -- run `make bootstrap` for local development; never defaults to development, because that would skip token validation}
      # Required on every POST /decisions (see routers/decisions.py) -- defense
      # in depth so a future accidental host-port re-exposure (or any other
      # container reachable on this compose network) still can't submit
      # decisions without also knowing this. Same default as origination-
      # service/gateway below so the three agree without an .env entry.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
    # No host port mapping: decision-service handles SSNs and the
    # decision-overwrite bug (see routers/decisions.py) means it must only be
    # reachable over the internal compose network, never from the host. The
    # gateway is the sole external path in (staff-only, see gateway/main.py).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  disclosure-service:
    build: ./services/disclosure-service
    env_file:
      - path: .env
        required: false
    environment:
      # Required on every POST /offers (see routers/offers.py) -- defense in
      # depth so a future accidental host-port re-exposure still can't submit
      # offers without also knowing this. Same default as the other services
      # so they all agree without an .env entry.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
    # No host port mapping: POST /offers persists the canonical TILA numbers
    # for an approved loan with no auth of its own -- publishing this let
    # anyone on the host bypass the gateway's staff-only /disclosure/* check
    # entirely (review finding). Reachable from other containers on the
    # compose network by service name; not reachable from the host.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./policies:/app/policies:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build: ./services/payment-service
    env_file:
      - path: .env
        required: false
    environment:
      # Required on every POST /payments (see routers/payments.py) -- defense
      # in depth so a future accidental host-port re-exposure still can't
      # charge a card without also knowing this. Same default as the other
      # services so they all agree without an .env entry.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
      # Review finding: this was missing. `env_file: .env` is `required: false`,
      # so on a clean checkout -- CI, or anyone who has not run the bootstrap --
      # payment-service started with ENVIRONMENT unset. config.py reads it to
      # decide ALLOW_PAYMENT_STUB, so the deterministic test processor refused
      # every authorization and payments failed with no configuration error to
      # point at.
      #
      # It was invisible locally for the same reason twice before on this branch:
      # a developer's own .env supplied the variable that CI does not have.
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env -- see .env.example, or run python scripts/bootstrap_env.py}
    # No host port mapping: POST /payments charges a card/ACH with no auth of
    # its own -- publishing this let anyone on the host bypass the gateway's
    # ownership check and move money directly (review finding). Reachable
    # from other containers on the compose network by service name; not from
    # the host.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      servicing-service:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8006/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  loan-assistant:
    build: ./services/loan-assistant
    env_file:
      - path: .env
        required: false
      # SSL_CERT_FILE/REQUESTS_CA_BUNDLE for local TLS-inspection workarounds --
      # split into their OWN file, loaded only here, deliberately NOT in the
      # shared .env every service's env_file already includes above. Setting
      # them in the shared file broke every other service's outbound httpx
      # calls (FileNotFoundError -- only this service has ./certs mounted).
      - path: .env.loan-assistant.local
        required: false
    environment:
      # corpus.py's local-checkout-relative default doesn't resolve inside this
      # image's shallower /app/app layout -- point it at the mount below instead.
      POLICIES_DIR: /app/policies
      # Bug fix: needed on the server-to-server call to origination-service's
      # /financials route (app/main.py's summarize()) -- that route requires
      # this on top of a staff X-User-Role, and every AI-summary request
      # 403'd without it. Same shared secret every other service already uses.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
    # No host port published — reachable only from other containers on the compose
    # network (gateway proxies /assistant/* to it internally). Publishing it would
    # let anyone on the host bypass the gateway's role check and trigger billed LLM
    # calls directly.
    volumes:
      - ./policies:/app/policies:ro
      # Local-machine TLS-inspection CA bundle (some corporate AV/proxy setups
      # re-sign outbound HTTPS with their own root, which httpx/anthropic don't
      # trust by default). ./certs is gitignored and empty unless a dev has
      # actually hit this -- SSL_CERT_FILE in .env.loan-assistant.local is what
      # opts a given machine in, this mount is harmless no-op for everyone else.
      - ./certs:/app/certs:ro
    depends_on:
      origination-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8007/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./services/gateway
    env_file:
      - path: .env
        required: false
    environment:
      # Forwarded as X-Internal-Token on the staff-ops /decision/* proxy path
      # (see app/main.py) -- must match decision-service's copy above.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env -- see .env.example}
      # The PRIVATE half of the principal signing pair. Gateway only -- any other
      # service holding it could mint an admin, which is the shared-secret
      # weakness the signature exists to remove (spec 0002 REQ-ID-3).
      PRINCIPAL_SIGNING_KEY: ${PRINCIPAL_SIGNING_KEY:?set PRINCIPAL_SIGNING_KEY in .env -- generate with python db/tools/generate_principal_keypair.py}
      # Read by this service's startup token validation, which treats an unset
      # ENVIRONMENT as production and fails closed (PR #18). Declared here
      # because compose passes a host variable through only to services that
      # name it, and `env_file: .env` is required:false -- see
      # db/tests/test_compose_declares_every_env_var_services_read.py.
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT in .env -- see .env.example, or run python scripts/bootstrap_env.py}
      # Rate limit. The DEFAULT STACK SHIPS THE REAL CONTROL: 120 requests /
      # 60s per client IP, the same number services/gateway/app/config.py
      # falls back to.
      #
      # This used to default to 2000 here, with a comment claiming the shipped
      # control was "not weakened" because config.py still said 120. Compose
      # substitutes its default and exports it, so the variable always won:
      # anyone running `make up` or `docker compose up` got a gateway that
      # permitted 2,000 requests a minute, and the 120 existed only in a file
      # nothing read. A control that the documented run path overrides is not a
      # control. Review finding on PR #10.
      #
      # The Playwright suite genuinely needs a higher ceiling -- a dozen browser
      # journeys from ONE source IP, which started returning 429 on /auth/me and
      # /los/applications as the suite grew. That now lives in
      # docker-compose.e2e.yml, applied explicitly by the e2e job and by anyone
      # running the suite locally:
      #
      #   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
      #
      # so raising the limit is a visible act rather than the default.
      RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW:-60}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      origination-service:
        condition: service_started
      servicing-service:
        condition: service_started
      kyc-service:
        condition: service_started
      decision-service:
        condition: service_started
      disclosure-service:
        condition: service_started
      payment-service:
        condition: service_started
      loan-assistant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
      GATEWAY_URL: http://gateway:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  # W7: scrapes /metrics off all 8 backend services (prometheus-fastapi-
  # instrumentator) -- no cross-service metrics existed anywhere before this.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
