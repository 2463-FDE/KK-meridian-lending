<rect x="60" y="250" width="380" height="120" rx="12" fill="#161b22" stroke="#8b93e8" stroke-width="2"/>
<text x="250.0" y="294.0" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">origination-service  :8001</text>
<text x="250.0" y="318.0" font-size="14.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">intake + boarding orchestrator</text>
