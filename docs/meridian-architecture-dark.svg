<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="1400" height="1010" role="img" aria-label="Meridian Lending architecture: a Next.js portal calls the gateway BFF, which routes to origination, servicing, the loan assistant and payments. Origination calls KYC, decision and disclosure services over synchronous HTTP; payment applies payments to servicing; the loan assistant is staff-only, read-only and has no database connection. PostgreSQL is shared by seven services; Redis holds sessions.">
<style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="1400" height="1010" fill="#0d1117"/>
<rect x="60" y="40" width="300" height="110" rx="12" fill="#11161d" stroke="#8b93e8" stroke-width="2"/>
<text x="210.0" y="90.0" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">Next.js portal</text>
<text x="210.0" y="114.0" font-size="14.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">borrower and staff screens</text>
<rect x="500" y="30" width="840" height="130" rx="12" fill="#11161d" stroke="#8b93e8" stroke-width="2"/>
<text x="920.0" y="79.0" font-size="18" font-weight="700" fill="#8b93e8" text-anchor="middle">Gateway (BFF)  :8000</text>
<text x="920.0" y="103.0" font-size="14.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">session auth · roles · rate limiting</text>
<text x="920.0" y="124.0" font-size="14.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">/auth · /los · /lss · /kyc · /assistant · /decision · /disclosure · /payments</text>
