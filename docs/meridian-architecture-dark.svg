<text x="700.0" y="339.0" font-size="14.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">read-only · no database connection</text>
<rect x="960" y="250" width="380" height="120" rx="12" fill="#161b22" stroke="#8b93e8" stroke-width="2"/>
