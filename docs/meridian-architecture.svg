<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1110" width="1660" height="1110" role="img" aria-label="Meridian Lending logical architecture. Borrowers and staff use the Next.js portal, which sends web/API requests to the gateway BFF (session auth, RBAC, rate limits; routes /auth, /los, /lss, /kyc, /decision, /disclosure, /payments, /assistant). Inside the private Compose network, origination-service is the system of record and makes internal calls to kyc-service, decision-service (a LangGraph state graph) and disclosure-service (driven by a two-node LangGraph disclosure orchestration); servicing-service holds the append-only ledger, maker-checker and reconciliation, and payment-service applies captured payments to it. Seven services share one PostgreSQL schema; Redis holds gateway sessions and rate limits. A staff-only advisory AI lane holds loan-assistant (RAG policy chat and a LangChain agent on AWS Bedrock with one bounded read-only policy tool), which reads origination read-only and has no database connection. Operations: Prometheus, Grafana, LangSmith tracing and CI.">
