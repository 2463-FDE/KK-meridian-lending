name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan for leaked secrets
        run: ./gitleaks detect --source . --redact -v

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, decision-service, disclosure-service, payment-service, loan-assistant]
    # Review fix: the real-Postgres tests (origination's decision-attempt
    # lock-order and TXN-B rollback proofs, disclosure's offer-repair proofs)
    # are all guarded by `skipif(not DATABASE_URL)`. No DATABASE_URL was set
    # here, so every one of them SKIPPED in CI and had only ever run on a
    # developer machine. They run here now.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meridian:postgres@localhost:5432/meridian
      # Services validate INTERNAL_SERVICE_TOKEN at import time and fail closed on
      # an empty or repository-known value (PR #18). An unset ENVIRONMENT is treated
      # as production on purpose, so CI has to say what it is.
      ENVIRONMENT: test
      INTERNAL_SERVICE_TOKEN: test-internal-token
      # Approved cohort/demo values, injected explicitly. There are no defaults
      # to fall back on -- servicing refuses to boot without them, which is the
      # behaviour these suites rely on.
      MAKER_CHECKER_ADMIN_THRESHOLD: "500.00"
      MAKER_CHECKER_MAX_DELTA: "5000.00"
      MAKER_CHECKER_PERMITTED_LOAN_STATUSES: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Import smoke
        run: |
          cd services/${{ matrix.service }}
          python -c "import app.main"
      - name: Tests
        # Blocking, all eight services: `|| true` on top of continue-on-error used to
        # double-mask every failure, including "No module named pytest" -- pytest was
        # never in requirements.txt or installed here at all, so this step silently
        # reported success without running a single test for this entire engagement.
        # The backend-known-flaky split (disclosure-service, then servicing-service)
        # is gone now too -- both had a real float-money bug (D12/D6), both fixed with
        # a real Decimal migration (see apr.py/offer.py/schedule.py and
        # balance.py/delinquency.py/schedule.py), both tests genuinely pass now. No
        # service in this repo has a known-failing test anymore.
        run: |
          cd services/${{ matrix.service }}
          python -m pytest -q --cov=app --cov-report=term-missing

  # Review finding: every backend Dockerfile unconditionally COPYed
  # combined-ca-bundle.pem, which .gitignore excludes and which isn't in the
  # repo -- `docker build` failed on any clean checkout. This runner has no
  # such file either, so it exercises the exact same clean-checkout path the
  # Dockerfiles now fall back on (see each service's Dockerfile).
  # Review finding: the base compose file now REQUIRES INTERNAL_SERVICE_TOKEN and
  # ENVIRONMENT, which is correct -- a token committed here is not a secret, and an
  # ENVIRONMENT default of "development" would skip the token-strength checks on the
  # money-moving routes. But it also broke the documented quick start, and CI did not
  # notice because every other job injects those variables itself.
  #
  # This job runs what a human is told to run, on a clean checkout, with NO
  # environment injected -- so the quick start cannot rot without the build failing.
  quick-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The base compose file must REFUSE a clean checkout
        run: |
          if docker compose config -q 2>/dev/null; then
            echo "docker compose config succeeded with no .env -- the base file is"
            echo "supplying a default for INTERNAL_SERVICE_TOKEN or ENVIRONMENT again."
            exit 1
          fi
          echo "refused, as intended"
      - name: Run the documented bootstrap
        # bootstrap now generates the principal keypair as well as the token, so
        # it needs the crypto library a service image would already carry.
        run: |
          pip install --quiet cryptography
          make bootstrap
      - name: The generated token must be real, and dev must be explicit
        run: |
          python - <<'PY'
          import pathlib, re, sys
          env = pathlib.Path(".env").read_text(encoding="utf-8")
          tok = re.search(r"^INTERNAL_SERVICE_TOKEN=(.+)$", env, re.M)
          assert tok, "bootstrap did not write INTERNAL_SERVICE_TOKEN"
          assert len(tok.group(1)) >= 32, f"generated token is only {len(tok.group(1))} chars"
          assert re.search(r"^ENVIRONMENT=development$", env, re.M), "ENVIRONMENT not set"
          print("bootstrap produced a usable .env")
          PY
      - name: The stack configuration must now succeed
        run: docker compose config -q
      - name: The generated token must never be committable
        run: |
          git check-ignore .env || { echo ".env is NOT gitignored -- a generated secret could be committed"; exit 1; }
          git status --porcelain | grep -q "^?? .env$" && { echo ".env shows as untracked-but-visible"; exit 1; } || true
          echo ".env is ignored"

  docker-build:
    runs-on: ubuntu-latest
    env:
      # compose now REFUSES to interpolate without this (docker-compose.yml uses
      # ${INTERNAL_SERVICE_TOKEN:?...}), because a repository-known fallback is
      # not a secret. CI supplies a throwaway value and marks itself as a test
      # environment, which is what lets the services accept a weak one.
      ENVIRONMENT: test
      INTERNAL_SERVICE_TOKEN: ci-throwaway-Jd7mQ2xR9vLpTn4wCe8bYk3ZaHsUfGi5
      MAKER_CHECKER_ADMIN_THRESHOLD: "500.00"
      MAKER_CHECKER_MAX_DELTA: "5000.00"
      MAKER_CHECKER_PERMITTED_LOAN_STATUSES: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate a throwaway principal keypair
        # compose REQUIRES both halves, because a key committed to this
        # repository is not a key -- whoever reads it can mint an admin. CI
        # generates a pair per run, exactly as `make bootstrap` does locally.
        run: |
          pip install --quiet cryptography
          python db/tools/generate_principal_keypair.py --github-env >> "$GITHUB_ENV"
      - name: docker compose build
        run: docker compose build

  # Review fix: db/migrations/*.sql were never actually run anywhere in CI --
  # 0010's backfill-before-dedup ordering bug (aborted on exactly the
  # duplicate-legacy-offer data it was meant to repair) could only have been
  # caught by actually applying it to a real Postgres. This job does that
  # against a real database instead of mocking SQL.
  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://meridian:postgres@localhost:5432/meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r db/tests/requirements.txt
      - name: Migration tests
        run: python -m pytest db/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # Committed, repeatable replacement for the interactive borrower-workflow
  # browser verification done during the offer-workflow/token-security audit
  # (that verification was never checked in, so it wasn't independently
  # repeatable -- see frontend/e2e/README.md). Blocking: no continue-on-error.
  #
  # Migration note: this job does NOT replay db/migrations on top of the
  # fresh db/init schema docker-compose.yml auto-applies -- db/init is this
  # repo's convention for what a fresh volume gets, and db/migrations exists
  # to upgrade an EXISTING database. That replay IS now exercised, in the
  # db-migrations job, by db/tests/test_migration_paths_converge.py: it runs
  # all four construction paths (fresh init; legacy schema + migrations;
  # fresh init + migrations; migrations twice) against real Postgres and
  # asserts they converge.
  #
  # The collision this comment used to describe -- 0020's bare ADD CONSTRAINT
  # of manual_reviews_app_id_key against the identically auto-named inline
  # UNIQUE in db/init -- is fixed (Gap D). The same guard was applied to the
  # three other migrations with the same defect: 0009, 0011 and 0015.
  e2e:
    runs-on: ubuntu-latest
    env:
      # compose now REFUSES to interpolate without this (docker-compose.yml uses
      # ${INTERNAL_SERVICE_TOKEN:?...}), because a repository-known fallback is
      # not a secret. CI supplies a throwaway value and marks itself as a test
      # environment, which is what lets the services accept a weak one.
      ENVIRONMENT: test
      INTERNAL_SERVICE_TOKEN: ci-throwaway-Jd7mQ2xR9vLpTn4wCe8bYk3ZaHsUfGi5
      MAKER_CHECKER_ADMIN_THRESHOLD: "500.00"
      MAKER_CHECKER_MAX_DELTA: "5000.00"
      MAKER_CHECKER_PERMITTED_LOAN_STATUSES: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate a throwaway principal keypair
        # compose REQUIRES both halves, because a key committed to this
        # repository is not a key -- whoever reads it can mint an admin. CI
        # generates a pair per run, exactly as `make bootstrap` does locally.
        run: |
          pip install --quiet cryptography
          python db/tools/generate_principal_keypair.py --github-env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start the full stack (fresh Postgres via db/init)
        # The e2e overlay raises ONLY the gateway rate limit, which a dozen
        # browser journeys from one source IP would otherwise trip. The default
        # stack ships the real 120/60s control -- see docker-compose.e2e.yml.
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for gateway + frontend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null && curl -sf http://localhost:3000/apply >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 3
          done
          echo "stack never became healthy" >&2
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci || npm install
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run borrower-workflow E2E
        env:
          DATABASE_URL: postgresql://meridian:postgres@localhost:5432/meridian
          E2E_BASE_URL: http://localhost:3000
        run: cd frontend && npm run test:e2e
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Screenshots only (only-on-failure) -- traces are off in
          # playwright.config.ts specifically so no artifact here can ever
          # contain the X-Offer-Accept-Token header value; the raw token
          # is never rendered as visible page text either. See
          # frontend/e2e/README.md.
          path: frontend/playwright-report/
          retention-days: 7
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=500

  # Dependency vulnerability scan -- no SAST/dependency audit existed at all before this.
  # Non-blocking for now: this repo has never been scanned, so the first run's findings
  # need triage (upgrade vs. accept-risk vs. false positive) before it's safe to gate the
  # build on. Drop continue-on-error once that triage lands. Covers all eight backend
  # services regardless of the money-math split above -- a vulnerable dependency is
  # unrelated to RF-13's float-money test failures.
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, decision-service, disclosure-service, payment-service, loan-assistant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (non-blocking -- first run, findings not yet triaged)
        continue-on-error: true
        run: |
          pip install pip-audit
          cd services/${{ matrix.service }}
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

  dependency-audit-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (non-blocking -- first run, findings not yet triaged)
        continue-on-error: true
        run: |
          cd frontend
          npm ci || npm install
          npm audit --audit-level=high

  # GAP: dependency-audit/dependency-audit-frontend above are still continue-on-error --
  # this repo has never had a dependency scan before, so findings need a first triage
  # pass (upgrade vs. accept-risk vs. false positive) before it's safe to gate on. No
  # SAST tool yet either.
  # FIXED: the backend-known-flaky split (disclosure-service, then servicing-service)
  # is gone -- both services' float-money bugs (D12/D6) got a real Decimal migration
  # (apr.py/offer.py/schedule.py; balance.py/delinquency.py/schedule.py), both known-
  # failing tests genuinely pass now, and all eight services run in one blocking job.
  # FIXED (review pass): pytest was never installed here (no requirements-dev.txt,
  # no separate install step) and `|| true` on the test command masked that
  # completely -- every "backend (X)" check has been reporting success without
  # running a single real test, for every PR, this entire engagement. Each service
  # now has requirements-dev.txt (pytest + pytest-cov); this step installs it and
  # reports coverage; `|| true` is gone so a real test failure is now visible.
